<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genç Altın Talep Takibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Düzen: üstte bölüm sekmeleri, solda tarihli listeler, sağda maddeler; telefonda listeler yatay şerit */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --line:#e4e1d8; --fg:#1d1c19; --muted:#6c685d;
  --accent:#8a6a1f; --accent-soft:#f3ecd9; --done:#2f7d4f; --done-soft:#e3f1e8; --danger:#b3412f;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.upd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 14px;font-weight:600;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px}
.layout{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
.lists{display:flex;flex-direction:column;gap:6px}
.lists h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
.list-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--fg);border-radius:10px;padding:10px 12px}
.list-btn:hover{background:var(--surface)}
.list-btn[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.list-btn .t{font-weight:600;font-size:14px;font-family:var(--f-mono)}
.list-btn .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.list-btn .m b{color:var(--done);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.main-head h3{margin:0;font-size:20px;text-wrap:balance}
.main-head .date{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);transition:width .3s}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);align-self:flex-start}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.item.done{background:var(--done-soft);border-color:transparent}
.chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:1px;color:transparent}
button.chk{cursor:pointer;padding:0}
button.chk:hover{border-color:var(--done)}
button.chk:disabled{opacity:.5;cursor:wait}
.item.done .chk{background:var(--done);border-color:var(--done);color:var(--bg)}
.chk svg{width:14px;height:14px}
.ibody{min-width:0;display:flex;flex-direction:column;gap:6px}
.ititle{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ititle .no{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.item.done .ititle span:last-child{text-decoration:line-through;text-decoration-color:var(--muted)}
.row{font-size:14px;overflow-wrap:anywhere}
.row b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:11px;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.item.done .pill{background:var(--surface);color:var(--done)}
.imgs{display:flex;flex-wrap:wrap;gap:8px}
.imgs .th{position:relative}
.imgs .th>button:first-child{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0;overflow:hidden;width:96px;height:72px;display:block}
.imgs .del{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:999px;border:2px solid var(--surface);background:var(--danger);color:#fff;font-size:15px;line-height:1;padding:0;display:grid;place-items:center}
.imgs .del:hover{filter:brightness(1.1)}
.imgs .del:disabled{opacity:.5;cursor:wait}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:50;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;border:0;background:#fff;color:#111;border-radius:999px;width:40px;height:40px;font-size:22px;line-height:1}
.up-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.up-btn{border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;min-height:36px}
.up-btn:hover{background:var(--accent-soft)}
.up-btn:disabled{opacity:.6;cursor:default}
.up-msg{font-size:12px;color:var(--muted)}
.up-msg.err{color:var(--danger)}
dialog{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--surface);color:var(--fg);width:min(360px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{display:flex;flex-direction:column;gap:12px;margin:0}
dialog h4{margin:0;font-size:17px}
dialog p{margin:0;font-size:13px;color:var(--muted)}
dialog input{font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
dialog .acts{display:flex;flex-direction:row-reverse;gap:8px;justify-content:flex-start}
dialog button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px;font-weight:600}
dialog button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}
.toast.err{background:var(--danger)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);margin-bottom:4px}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;gap:16px}
  .lists{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .lists h2{display:none}
  .list-btn{width:auto;min-width:150px;flex:0 0 auto;border-color:var(--line);background:var(--surface)}
  .list-btn[aria-current="true"]{border-color:var(--accent)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Genç Altın Talep Takibi</h1>
      <p class="sub">Yazılım ekibine iletilen talepler ve durumları</p>
    </div>
    <span class="upd" id="upd">Yükleniyor…</span>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="layout">
    <nav class="lists" id="lists" aria-label="Tarihler"><h2>Tarihler</h2></nav>
    <section class="main" id="main"><div class="empty"><strong>Talepler yükleniyor</strong>Tablo okunuyor.</div></section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<dialog id="pinDlg">
  <form method="dialog" id="pinForm">
    <h4>Yetkili şifresi</h4>
    <p id="pinMsg">Maddeyi işaretlemek veya görsel silmek için şifreyi gir. Bu cihazda hatırlanır.</p>
    <input id="pinIn" type="password" autocomplete="current-password" required>
    <div class="acts"><button class="pri" value="ok">Devam</button><button value="cancel" formnovalidate>Vazgeç</button></div>
  </form>
</dialog>

<script>
//#region Ayarlar
// Google Sheets dosyası ve bölüm (sekme) adları
const SHEET_ID="1hXGcX848sVQWQ4wWBAPlwVQtdrApL4H6CoxajmXY-eg";
const SECTIONS=["Mobil","Entegre","E-Ticaret"];
const REFRESH_MS=60000; // dakikada bir yenile
// Görsel yükleme servisi (Google Apps Script web uygulaması adresi). Boşsa "Görsel ekle" butonu görünmez
const UPLOAD_URL="https://script.google.com/macros/s/AKfycbz_-cjKe0DgWbf_xGrWQ65bHX6IO3KCotkhY0Lw5vuVkqIXZ6P6Y0EMcrK6TTffVKzl/exec";
//#endregion

//#region Durum ve yardımcılar
const S={data:{},tab:SECTIONS[0],sel:{},filter:"all",error:null,up:{},shown:[],ticks:{},dels:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
// "23.10.2026" -> "2026-10-23" (sıralama için)
const sortKey=d=>{const m=String(d).match(/(\d{1,2})[./](\d{1,2})[./](\d{4})/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:String(d)};
const keyOf=(tab,it)=>tab+"|"+it.no+"|"+it.title;
const isDone=v=>/yap[ıi]ld[ıi]|true|evet|✓/i.test(String(v||""));
try{const h=decodeURIComponent(location.hash.slice(1));if(SECTIONS.includes(h))S.tab=h}catch(e){}
//#endregion

//#region CSV okuma
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
// Satırları başlık adlarına göre nesneye çevir
function toItems(rows){
  if(!rows.length)return[];
  const h=rows[0].map(x=>x.trim().toLocaleLowerCase("tr"));
  const col=n=>h.findIndex(x=>x.startsWith(n));
  const ix={tarih:col("tarih"),no:col("no"),baslik:col("başlık"),tur:col("tür"),sorun:col("sorun"),bek:col("beklenen"),durum:col("durum"),ydt:col("yapıldı"),gorsel:col("görsel")};
  const g=(r,k)=>ix[k]>=0?(r[ix[k]]||"").trim():"";
  return rows.slice(1).filter(r=>g(r,"baslik")).map(r=>({
    tarih:fixDate(g(r,"tarih"))||"Tarihsiz",no:g(r,"no"),title:g(r,"baslik"),tur:g(r,"tur"),
    sorun:g(r,"sorun"),beklenen:g(r,"bek"),done:isDone(g(r,"durum")),doneAt:fixDate(g(r,"ydt")),
    imgs:imgLinks(g(r,"gorsel"))
  }));
}
// Tablo tarihi sayı olarak verirse (ör. 46320) gg.aa.yyyy'ye çevir; ISO tarihleri de çevir
function fixDate(v){
  if(/^\d{5}(\.\d+)?$/.test(v)){
    const d=new Date(Date.UTC(1899,11,30)+Math.floor(+v)*864e5);
    return `${String(d.getUTCDate()).padStart(2,"0")}.${String(d.getUTCMonth()+1).padStart(2,"0")}.${d.getUTCFullYear()}`;
  }
  const m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?`${m[3]}.${m[2]}.${m[1]}`:v;
}
// Görsel hücresindeki linkleri ayır; Drive linklerini gösterilebilir adrese çevir
function imgLinks(cell){
  return (cell.match(/https?:\/\/[^\s,;]+/g)||[]).map(u=>{
    const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
    return m?{ref:m[1],thumb:`https://drive.google.com/thumbnail?id=${m[1]}&sz=w400`,full:`https://drive.google.com/thumbnail?id=${m[1]}&sz=w2000`}:{ref:u,thumb:u,full:u};
  });
}
async function load(){
  try{
    const res=await Promise.all(SECTIONS.map(async s=>{
      const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(s)}&_=${Date.now()}`;
      const r=await fetch(url);
      if(!r.ok)throw new Error(r.status);
      const t=await r.text();
      if(t.trim().startsWith("<"))throw new Error("erisim"); // giriş sayfası döndüyse tablo paylaşılmamıştır
      return[s,toItems(parseCSV(t))];
    }));
    S.data=Object.fromEntries(res);S.error=null;
    // Yeni atılan tikler tabloya geç yansıyabilir; 2 dakika boyunca sitedeki son hali koru
    const now=Date.now();
    for(const [k,o] of Object.entries(S.ticks)){
      if(now-o.t>120000){delete S.ticks[k];continue}
      const [tab]=k.split("|");const it=(S.data[tab]||[]).find(x=>keyOf(tab,x)===k);
      if(it){it.done=o.done;it.doneAt=o.doneAt}
    }
    // Yeni silinen görseller tabloya geç yansırsa geri gelmesin
    S.dels=S.dels.filter(d=>now-d.t<120000);
    for(const d of S.dels){const it=(S.data[d.tab]||[]).find(x=>keyOf(d.tab,x)===d.key);if(it)it.imgs=it.imgs.filter(m=>m.ref!==d.ref)}
    $("upd").textContent="Güncellendi "+new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    S.error=e;$("upd").textContent="Bağlantı hatası";
  }
  render();
}
//#endregion

//#region Çizim
function render(){
  // Bölüm sekmeleri
  $("tabs").innerHTML=SECTIONS.map(s=>{
    const its=S.data[s]||[],open=its.filter(i=>!i.done).length;
    return`<button role="tab" data-tab="${esc(s)}" aria-selected="${s===S.tab}">${esc(s)}${its.length?`<span class="cnt">${open}</span>`:""}</button>`}).join("");
  const items=S.data[S.tab]||[];
  // Tarihe göre grupla (yeniden eskiye)
  const groups={};items.forEach(i=>(groups[i.tarih]=groups[i.tarih]||[]).push(i));
  const dates=Object.keys(groups).sort((a,b)=>sortKey(b).localeCompare(sortKey(a)));
  if(!dates.includes(S.sel[S.tab]))S.sel[S.tab]=dates[0];
  const sel=S.sel[S.tab];
  $("lists").innerHTML='<h2>Tarihler</h2>'+dates.map(d=>{
    const g=groups[d],dn=g.filter(i=>i.done).length;
    return`<button class="list-btn" data-date="${esc(d)}" aria-current="${d===sel}"><span class="t">${esc(d)}</span><span class="m"><b>${dn}</b>/${g.length} yapıldı</span></button>`}).join("");
  $("lists").hidden=!dates.length;
  const main=$("main");
  if(S.error&&!items.length){main.innerHTML='<div class="empty"><strong>Talepler okunamadı</strong>Tablo herkese açık paylaşılmamış olabilir ya da bağlantı yok. Biraz sonra tekrar dene.</div>';return}
  if(!dates.length){main.innerHTML=`<div class="empty"><strong>${esc(S.tab)} bölümünde henüz talep yok</strong>Talepler eklendiğinde burada görünecek.</div>`;return}
  const all=groups[sel].slice().sort((a,b)=>(+a.no||0)-(+b.no||0));
  const done=all.filter(i=>i.done).length,pct=Math.round(done/all.length*100);
  const shown=all.filter(i=>S.filter==="all"||(S.filter==="done"?i.done:!i.done));
  S.shown=shown;
  const seg=(k,l)=>`<button data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`;
  main.innerHTML=`
    <div class="main-head"><span class="date">${esc(sel)}</span><h3>${esc(S.tab)} Talepleri</h3></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="meta"><span><b style="color:var(--fg)">${done}/${all.length}</b> madde yapıldı</span><span>%${pct}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="seg" role="group" aria-label="Filtre">${seg("all","Tümü")}${seg("open","Bekleyen")}${seg("done","Yapıldı")}</div>
    <div class="items">${shown.length?shown.map((it,ix)=>`
      <article class="item${it.done?" done":""}">
        ${UPLOAD_URL?`<button class="chk" data-tick="${ix}" aria-pressed="${it.done}" aria-label="${it.done?"Yapılmadı olarak işaretle":"Yapıldı olarak işaretle"}" ${it.busy?"disabled":""}>${CHECK}</button>`:`<span class="chk" aria-label="${it.done?"Yapıldı":"Bekliyor"}">${CHECK}</span>`}
        <div class="ibody">
          <div class="ititle"><span class="no">Madde ${esc(it.no)}</span><span>${esc(it.title)}</span></div>
          ${it.sorun?`<div class="row"><b>${/talep/i.test(it.tur)?"Talep":"Sorun"}</b>${esc(it.sorun)}</div>`:""}
          ${it.beklenen?`<div class="row"><b>Beklenen</b>${esc(it.beklenen)}</div>`:""}
          ${it.imgs.length?`<div class="imgs">${it.imgs.map((im,k)=>`<div class="th"><button data-full="${esc(im.full)}" aria-label="Görsel ${k+1} büyüt"><img src="${esc(im.thumb)}" alt="Görsel ${k+1}" loading="lazy"></button>${UPLOAD_URL&&im.ref?`<button class="del" data-del="${ix}:${k}" aria-label="Görsel ${k+1} sil" ${im.busy?"disabled":""}>×</button>`:""}</div>`).join("")}</div>`:""}
          ${UPLOAD_URL?(()=>{const u=S.up[keyOf(S.tab,it)];return`<div class="up-row"><button class="up-btn" data-up="${ix}" ${u&&u.busy?"disabled":""}>+ Görsel ekle</button>${u?`<span class="up-msg${u.err?" err":""}">${esc(u.msg)}</span>`:""}</div>`})():""}
          <div class="meta"><span class="pill">${it.done?"Yapıldı"+(it.doneAt?" · "+esc(it.doneAt):""):"Bekliyor"}</span></div>
        </div>
      </article>`).join(""):'<div class="empty">Bu filtrede madde yok.</div>'}</div>`;
}
//#endregion

//#region Görsel yükleme
let upTarget=null,afterPin=null;
// Kısa bilgi mesajı
function toast(msg,err){const t=$("toast");t.textContent=msg;t.className="toast"+(err?" err":"");t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3000)}
const getPin=()=>{try{return localStorage.getItem("gt_pin")||""}catch(e){return""}};
const setPin=v=>{try{v?localStorage.setItem("gt_pin",v):localStorage.removeItem("gt_pin")}catch(e){}};
// Butona basınca: şifre yoksa sor, sonra dosya seçtir
function startUpload(it){
  if(!it)return;
  upTarget={tab:S.tab,it};
  // Görsel eklemek şifresiz
  $("fileIn").value="";$("fileIn").click();
}
// Şifre kayıtlıysa işi hemen yap, değilse önce şifre sor
function withPin(fn){
  if(getPin()){fn();return}
  afterPin=fn;$("pinIn").value="";$("pinDlg").showModal();
}
$("pinDlg").addEventListener("close",()=>{
  const fn=afterPin;afterPin=null;
  if($("pinDlg").returnValue!=="ok"||!$("pinIn").value.trim()||!fn)return;
  setPin($("pinIn").value.trim());fn();
});
// Servise istek gönder (text/plain: tarayıcı ön kontrol yapmasın)
async function callApi(body){
  const r=await fetch(UPLOAD_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({sifre:getPin(),...body})});
  return r.json();
}
// Tik: Yapıldı <-> Bekliyor
function startTick(it){
  if(!it||it.busy)return;
  const tab=S.tab;
  withPin(async()=>{
    const prev={done:it.done,doneAt:it.doneAt};
    const now=new Date();
    it.done=!it.done;it.doneAt=it.done?`${String(now.getDate()).padStart(2,"0")}.${String(now.getMonth()+1).padStart(2,"0")}.${now.getFullYear()}`:"";
    it.busy=true;render();
    try{
      const j=await callApi({islem:"durum",sekme:tab,no:it.no,baslik:it.title,yapildi:it.done});
      if(j.ok){S.ticks[keyOf(tab,it)]={done:it.done,doneAt:it.doneAt,t:Date.now()};toast(it.done?"Yapıldı olarak işaretlendi":"Bekliyor'a alındı")}
      if(!j.ok){
        Object.assign(it,prev);
        if(j.hata==="sifre"){setPin("");toast("Şifre yanlış. Tekrar dene.",true)}
        else toast("Kaydedilemedi: "+j.hata,true);
      }
    }catch(e){Object.assign(it,prev);toast("Kaydedilemedi. Bağlantını kontrol edip tekrar dene.",true)}
    it.busy=false;render();
  });
}
// Görseli en fazla 1600px'e küçültüp JPEG'e çevir (yükleme hızlı olsun)
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,1600/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("okunamadı"))};
    img.src=url;
  });
}
// Görsel silme (şifreli): Drive'dan çöpe atar, tablodaki linki kaldırır
function startDelete(it,k){
  const im=it&&it.imgs[k];if(!im||!im.ref||im.busy)return;
  if(!confirm("Bu görsel silinsin mi?"))return;
  const tab=S.tab;
  withPin(async()=>{
    im.busy=true;render();
    try{
      const j=await callApi({islem:"gorselSil",sekme:tab,no:it.no,baslik:it.title,ref:im.ref});
      if(j.ok){it.imgs.splice(it.imgs.indexOf(im),1);S.dels.push({tab,key:keyOf(tab,it),ref:im.ref,t:Date.now()});toast("Görsel silindi")}
      else if(j.hata==="sifre"){setPin("");toast("Şifre yanlış. Tekrar dene.",true)}
      else toast("Silinemedi: "+j.hata,true);
    }catch(e){toast("Silinemedi. Bağlantını kontrol edip tekrar dene.",true)}
    im.busy=false;render();
  });
}
$("fileIn").addEventListener("change",async()=>{
  const files=[...$("fileIn").files];if(!files.length||!upTarget)return;
  const {tab,it}=upTarget,key=keyOf(tab,it);
  let ok=0;
  for(let i=0;i<files.length;i++){
    S.up[key]={busy:true,msg:`Yükleniyor ${i+1}/${files.length}…`};render();
    try{
      const dataUrl=await shrink(files[i]);
      // text/plain gönderiyoruz ki tarayıcı ön kontrol (CORS preflight) yapmasın
      const j=await callApi({sekme:tab,no:it.no,baslik:it.title,ad:files[i].name.replace(/\.\w+$/,"")+".jpg",data:dataUrl.split(",")[1]});
      if(!j.ok){
        throw new Error(j.hata||"hata");
      }
      it.imgs.push({thumb:dataUrl,full:dataUrl});ok++;
    }catch(e){S.up[key]={err:true,msg:"Yüklenemedi. Bağlantını kontrol edip tekrar dene."};render();return}
  }
  S.up[key]={msg:`${ok} görsel eklendi.`};render();
  setTimeout(()=>{delete S.up[key];load()},5000);
});
//#endregion

//#region Olaylar
document.addEventListener("click",e=>{
  // Büyük görseli kapat
  if(e.target.closest(".lb")&&!e.target.closest("img")){e.target.closest(".lb").remove();return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.full){
    const lb=document.createElement("div");lb.className="lb";
    lb.innerHTML=`<button class="x" aria-label="Kapat">×</button><img src="${esc(b.dataset.full)}" alt="">`;
    document.body.appendChild(lb);return;
  }
  if(b.dataset.up!==undefined){startUpload(S.shown[+b.dataset.up]);return}
  if(b.dataset.tick!==undefined){startTick(S.shown[+b.dataset.tick]);return}
  if(b.dataset.del!==undefined){const [i,k]=b.dataset.del.split(":").map(Number);startDelete(S.shown[i],k);return}
  if(b.dataset.tab){S.tab=b.dataset.tab;history.replaceState(null,"","#"+encodeURIComponent(S.tab));render()}
  else if(b.dataset.date){S.sel[S.tab]=b.dataset.date;render()}
  else if(b.dataset.filter){S.filter=b.dataset.filter;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelector(".lb")?.remove()});
load();setInterval(load,REFRESH_MS);
//#endregion
</script>
</body>
